name: Publish plant diary API image

on:
  push:
    branches:
      - main
    paths:
      - "plant_api/**"
      - "data/sync_baseline.json"
      - "data/plants.json"
      - "data/photos.json"
      - ".dockerignore"
      - ".github/workflows/publish-plant-api-image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plant-api-image
  cancel-in-progress: false

env:
  IMAGE: cr.yandex/crp3b3hof2v6bgbgdodq/plant-diary-api

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            plant_api/requirements.txt
            plant_api/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r plant_api/requirements.txt -r plant_api/requirements-dev.txt

      - name: Run tests
        run: python3 -B -m unittest discover -s tests -v

      - name: Log in to Yandex Container Registry
        env:
          YC_SA_JSON_CREDENTIALS: ${{ secrets.YC_SA_JSON_CREDENTIALS }}
        run: |
          if [ -z "$YC_SA_JSON_CREDENTIALS" ]; then
            echo "YC_SA_JSON_CREDENTIALS is not configured" >&2
            exit 1
          fi
          printf '%s' "$YC_SA_JSON_CREDENTIALS" | \
            docker login --username json_key --password-stdin cr.yandex

      - name: Build image
        run: |
          docker build \
            --file plant_api/Dockerfile \
            --tag "$IMAGE:$GITHUB_SHA" \
            --tag "$IMAGE:latest" \
            .

      - name: Push immutable image tag
        run: docker push "$IMAGE:$GITHUB_SHA"

      - name: Push latest image tag
        run: docker push "$IMAGE:latest"
