openapi: 3.1.0
info:
  title: Plant Diary GPT Action API
  version: 0.1.1
  description: >-
    Private API for finding plants, adding photos and events, creating plants,
    correcting plant identity, and choosing a cover photo. Plant IDs are permanent.
servers:
  - url: https://plant-api.example.com
security:
  - PlantApiKey: []
paths:
  /plants/search:
    get:
      operationId: searchPlants
      summary: Find existing plants before any mutation.
      description: Search by permanent Plant ID, display name, Latin name, or cultivar.
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        "200":
          description: Matching plants.
          content:
            application/json:
              schema:
                type: object
                properties:
                  query:
                    type: string
                  plants:
                    type: array
                    items:
                      type: object
                      properties:
                        plant_id: {type: integer}
                        name: {type: string}
                        latin_name: {type: string, nullable: true}
                        cultivar: {type: string, nullable: true}
                        group: {type: string, nullable: true}
                        status: {type: string, nullable: true}
                        date_added: {type: string, format: date, nullable: true}
                        main_photo_url: {type: string, nullable: true}
                      additionalProperties: true
                additionalProperties: true
  /plants/{plant_id}:
    get:
      operationId: getPlant
      summary: Read one plant by its permanent ID.
      parameters:
        - name: plant_id
          in: path
          required: true
          description: Permanent positive Plant ID. Never renumber or reuse it.
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Current plant identity and cover.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plant_id: {type: integer}
                  name: {type: string}
                  latin_name: {type: string, nullable: true}
                  cultivar: {type: string, nullable: true}
                  group: {type: string, nullable: true}
                  status: {type: string, nullable: true}
                  date_added: {type: string, format: date, nullable: true}
                  main_photo_url: {type: string, nullable: true}
                additionalProperties: true
  /plants/{plant_id}/photos:
    get:
      operationId: listPlantPhotos
      summary: List existing photos so the user can choose a cover.
      parameters:
        - name: plant_id
          in: path
          required: true
          description: Permanent positive Plant ID.
          schema: {type: integer, minimum: 1}
      responses:
        "200":
          description: Photos linked to this plant, newest first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  plant_id: {type: integer}
                  photos:
                    type: array
                    items:
                      type: object
                      properties:
                        photo_record_id: {type: string}
                        filename: {type: string}
                        date: {type: string, format: date, nullable: true}
                        type: {type: string}
                        comment: {type: string, nullable: true}
                        web_key: {type: string}
                        url: {type: string}
                        is_group_photo: {type: boolean}
                        linked_plant_ids:
                          type: array
                          items: {type: integer}
                      additionalProperties: true
                additionalProperties: true
    post:
      operationId: addPhotos
      summary: Add up to ten conversation images to an existing plant.
      description: >-
        Preview first. Set confirmed=true only after the user approves the Plant ID,
        files, date, type, comment, and cover choice. Plant ID never changes.
      parameters:
        - name: plant_id
          in: path
          required: true
          description: Permanent positive Plant ID.
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, openaiFileIdRefs]
              properties:
                confirmed:
                  type: boolean
                  default: false
                  description: True only after explicit user confirmation.
                openaiFileIdRefs:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items: {type: string}
                  description: One to ten images uploaded in this conversation.
                date:
                  type: string
                  format: date
                  nullable: true
                  description: Exact photo date. Leave empty rather than inventing one.
                type:
                  type: string
                  enum: [Основное, Состояние, Корни, Цветение, Историческое, Референс продавца]
                  default: Состояние
                comment: {type: string, nullable: true}
                cover_file_id:
                  type: string
                  nullable: true
                  description: Attached OpenAI file ID to use as the cover.
              additionalProperties: false
      responses:
        "200":
          description: Preview, dry-run, or completed result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  planned_change:
                    type: object
                    nullable: true
                    properties:
                      operation: {type: string}
                      file_count: {type: integer}
                      filenames:
                        type: array
                        items: {type: string}
                      cover_file_id: {type: string, nullable: true}
                    additionalProperties: true
                additionalProperties: true
  /plants:
    post:
      operationId: createPlant
      summary: Create one new physical plant specimen and optionally add photos.
      description: >-
        Never supply Plant ID. Preview first; the server proposes max+1. After approval,
        set confirmed=true and copy proposed_plant_id to expected_plant_id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, name]
              properties:
                confirmed:
                  type: boolean
                  default: false
                  description: True only after explicit user confirmation.
                expected_plant_id:
                  type: integer
                  minimum: 1
                  nullable: true
                  description: Omit for preview; copy proposed_plant_id after confirmation.
                name: {type: string, minLength: 1}
                latin_name: {type: string, nullable: true}
                cultivar: {type: string, nullable: true}
                group: {type: string, nullable: true}
                status: {type: string, default: Наблюдение}
                notes: {type: string, nullable: true}
                date_added: {type: string, format: date, nullable: true}
                openaiFileIdRefs:
                  type: array
                  maxItems: 10
                  items: {type: string}
                  description: Optional images uploaded in this conversation.
                photo_type:
                  type: string
                  enum: [Основное, Состояние, Корни, Цветение, Историческое, Референс продавца]
                  default: Состояние
                photo_comment: {type: string, nullable: true}
                cover_file_id:
                  type: string
                  nullable: true
                  description: Attached OpenAI file ID to use as the cover.
                acquisition_event:
                  type: object
                  nullable: true
                  required: [type, date_precision]
                  properties:
                    type:
                      type: string
                      enum: [Наблюдение, Пересадка, Обрезка, Цветение, Полив, Обработка, Размножение, Покупка/получение, Продажа/передача, Другое]
                    title: {type: string, nullable: true}
                    description: {type: string, nullable: true}
                    date: {type: string, format: date, nullable: true}
                    date_precision:
                      type: string
                      enum: [Точная, Приблизительная, Только месяц/год, Неизвестна]
                    period: {type: string, nullable: true}
                  additionalProperties: false
              additionalProperties: false
      responses:
        "200":
          description: Preview, dry-run, or completed result with the assigned Plant ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  plant_id: {type: integer, nullable: true}
                  planned_change:
                    type: object
                    nullable: true
                    properties:
                      operation: {type: string}
                      proposed_plant_id: {type: integer}
                      name: {type: string}
                      file_count: {type: integer}
                    additionalProperties: true
                additionalProperties: true
  /plants/{plant_id}/identity:
    patch:
      operationId: updatePlantIdentity
      summary: Correct plant identity without changing Plant ID.
      description: >-
        Fetch first, show the exact before/after change, and ask for confirmation.
        Pass the fetched name as expected_current_name.
      parameters:
        - name: plant_id
          in: path
          required: true
          description: Permanent positive Plant ID.
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, expected_current_name]
              properties:
                confirmed:
                  type: boolean
                  default: false
                  description: True only after explicit user confirmation.
                expected_current_name: {type: string}
                name: {type: string, nullable: true}
                latin_name: {type: string, nullable: true}
                cultivar: {type: string, nullable: true}
              additionalProperties: false
      responses:
        "200":
          description: Preview, dry-run, no-change, or completed result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  planned_change:
                    type: object
                    nullable: true
                    properties:
                      operation: {type: string}
                      expected_current_name: {type: string}
                      name: {type: string, nullable: true}
                    additionalProperties: true
                additionalProperties: true
  /plants/{plant_id}/cover:
    put:
      operationId: setPlantCover
      summary: Set an uploaded photo as the plant card cover.
      description: >-
        List photos first, show the selected image, and ask for confirmation.
        A group photo requires a separate explicit confirmation.
      parameters:
        - name: plant_id
          in: path
          required: true
          description: Permanent positive Plant ID.
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
                  default: false
                  description: True only after explicit user confirmation.
                photo_record_id: {type: string, nullable: true}
                web_key: {type: string, nullable: true}
                allow_group_photo: {type: boolean, default: false}
              additionalProperties: false
      responses:
        "200":
          description: Preview, dry-run, or completed result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  planned_change:
                    type: object
                    nullable: true
                    properties:
                      operation: {type: string}
                      photo_record_id: {type: string, nullable: true}
                      web_key: {type: string, nullable: true}
                    additionalProperties: true
                additionalProperties: true
  /plants/{plant_id}/cover/automatic:
    post:
      operationId: clearPlantCover
      summary: Restore automatic cover selection.
      parameters:
        - name: plant_id
          in: path
          required: true
          description: Permanent positive Plant ID.
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed]
              properties:
                confirmed:
                  type: boolean
                  default: false
                  description: True only after explicit user confirmation.
              additionalProperties: false
      responses:
        "200":
          description: Preview, dry-run, or completed result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  planned_change:
                    type: object
                    nullable: true
                    properties:
                      operation: {type: string}
                    additionalProperties: true
                additionalProperties: true
  /plants/{plant_id}/events:
    post:
      operationId: addPlantEvent
      summary: Add an observation or care event to an existing plant.
      description: Never invent an exact date. Use period when only an approximate date is known.
      parameters:
        - name: plant_id
          in: path
          required: true
          description: Permanent positive Plant ID.
          schema: {type: integer, minimum: 1}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmed, type, date_precision]
              properties:
                confirmed:
                  type: boolean
                  default: false
                  description: True only after explicit user confirmation.
                type:
                  type: string
                  enum: [Наблюдение, Пересадка, Обрезка, Цветение, Полив, Обработка, Размножение, Покупка/получение, Продажа/передача, Другое]
                title: {type: string, nullable: true}
                description: {type: string, nullable: true}
                date: {type: string, format: date, nullable: true}
                date_precision:
                  type: string
                  enum: [Точная, Приблизительная, Только месяц/год, Неизвестна]
                period: {type: string, nullable: true}
              additionalProperties: false
      responses:
        "200":
          description: Preview, dry-run, or completed result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string}
                  planned_change:
                    type: object
                    nullable: true
                    properties:
                      operation: {type: string}
                      type: {type: string}
                      title: {type: string, nullable: true}
                    additionalProperties: true
                additionalProperties: true
components:
  schemas: {}
  securitySchemes:
    PlantApiKey:
      type: apiKey
      in: header
      name: X-Plant-API-Key
